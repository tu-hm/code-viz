id: cpp17-gcc
displayName: "C++17 (GCC 13)"
editorMode: c_cpp
image: viz-runner-cpp:13.5-gdb14-1
sourceFile: main.cpp
build:
  # gcc sizes its gc heap from host ram, not the box's 256 MiB => ggc params collect early so builds without the pch fit (S7)
  # kernel-address with every check a call => each load calls /opt/viz/reads.o, which records it for the read hints (§19.9.2)
  cmd: ["g++", "-std=gnu++17", "-O0", "-g3", "-fno-omit-frame-pointer", "--coverage", "-Wall", "-Wextra", "-Wshadow", "-fdiagnostics-plain-output", "--param", "ggc-min-heapsize=32768", "--param", "ggc-min-expand=30", "-fsanitize=kernel-address", "-fno-sanitize-address-use-after-scope", "--param", "asan-instrumentation-with-call-threshold=0", "--param", "asan-stack=0", "--param", "asan-globals=0", "--param", "asan-memintrin=0", "main.cpp", "/opt/viz/flush_init.cpp", "/opt/viz/reads.o", "-o", "main"]
  safetyFlags: ["-D_GLIBCXX_DEBUG", "-fsanitize=undefined", "-fno-sanitize-recover=all"]
  env: { TMPDIR: /work }
  timeoutMs: 10000
trace:
  cmd: ["gdb", "-q", "-nx", "-batch", "-x", "/opt/viz/trace.py", "--args", "./main"]
  env: { VIZ_PROTOCOL_FD: "3" }
capabilities:
  returnValues: true
  pointers: true
  exceptions: true
  startAtLines: true
  captureRanges: true
enabled: true
rollout: { percent: 100 }
