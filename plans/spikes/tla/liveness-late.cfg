\* the same with late writes: zombie workers still end, and every job with them
SPECIFICATION LiveSpec
CONSTANTS
    Keys = {k1}
    Vizs = {v1, v2, v3}
    Procs = {p1, p2}
    MaxAttempts = 2
    MaxCrashes = 1
    SharedName = FALSE
    LateWrites = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    JobsEnd
    VisualizationsSettle
CHECK_DEADLOCK FALSE
