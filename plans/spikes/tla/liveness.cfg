\* fair workers, rescuer and lease expiry: no job is lost and no visualization waits forever
SPECIFICATION LiveSpec
CONSTANTS
    Keys = {k1}
    Vizs = {v1, v2, v3}
    Procs = {p1, p2}
    MaxAttempts = 2
    MaxCrashes = 1
    SharedName = FALSE
    LateWrites = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    JobsEnd
    VisualizationsSettle
CHECK_DEADLOCK FALSE
