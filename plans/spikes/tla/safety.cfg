\* perfect clocks, unique worker names: every safety invariant should hold
SPECIFICATION Spec
CONSTANTS
    Keys = {k1, k2}
    Vizs = {v1, v2, v3}
    Procs = {p1, p2}
    MaxAttempts = 2
    MaxCrashes = 1
    SharedName = FALSE
    LateWrites = FALSE
INVARIANTS
    TypeOK
    OneLiveJobPerTrace
    TraceMatchesJob
    AttemptsBounded
    AttachedNeverCanceled
    CompletedByCurrentLease
    ChunksMatchTrace
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
