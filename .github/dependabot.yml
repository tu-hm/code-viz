version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go):"

  # npm (pnpm) dependencies
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(npm):"

  # Docker
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: docker
    directory: /backend/adapters/python
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker):"
    # tracer.py depends on 3.12 opcodes and settrace behavior; move minors by hand
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ci):"
