name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # ── Go build cache (module cache handled by setup-go) ──
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      # ── parallel: lint + vuln + mod-tidy ──
      - name: lint & vuln & mod tidy
        run: make check-static

      # ── codegen drift check ──
      - name: gen check
        run: make gen-check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: typecheck tracers
        run: make typecheck

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      # ── runner images: same builds as make runner-images, layers cached in gha ──
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: runner
        run: |
          echo "python=$(sed -n 's/^image: //p' adapters/python/manifest.yaml)" >> "$GITHUB_OUTPUT"
          echo "cpp=$(sed -n 's/^image: //p' adapters/cpp/manifest.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/adapters/python/Dockerfile
          tags: ${{ steps.runner.outputs.python }}
          load: true
          cache-from: type=gha,scope=runner-python-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=runner-python-${{ runner.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/adapters/cpp/Dockerfile
          tags: ${{ steps.runner.outputs.cpp }}
          load: true
          cache-from: type=gha,scope=runner-cpp-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=runner-cpp-${{ runner.arch }}

      # ── tests: -short on PRs, full on push to main ──
      - name: test
        run: go test -vet=off ${{ github.event_name == 'pull_request' && '-short' || '' }} ./...

  backend-nsjail:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-nsjail

  golden-arm64:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: runner
        run: |
          echo "python=$(sed -n 's/^image: //p' adapters/python/manifest.yaml)" >> "$GITHUB_OUTPUT"
          echo "cpp=$(sed -n 's/^image: //p' adapters/cpp/manifest.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/adapters/python/Dockerfile
          tags: ${{ steps.runner.outputs.python }}
          load: true
          cache-from: type=gha,scope=runner-python-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=runner-python-${{ runner.arch }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/adapters/cpp/Dockerfile
          tags: ${{ steps.runner.outputs.cpp }}
          load: true
          cache-from: type=gha,scope=runner-cpp-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=runner-cpp-${{ runner.arch }}
      - run: go test -count=1 -run Golden ./internal/tracecore ./cmd/vizctl

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
